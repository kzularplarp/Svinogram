name: Build Telegram 11.12 unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-15 ARM currently has a GitHub runner image bug where ibtool can
    # report "iOS 18.2 Platform Not Installed" even with Xcode 16.2 selected.
    # macos-14 ARM has Xcode 16.2 + iOS 18.2 installed and avoids that bug.
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          sw_vers
          uname -m

          echo "=== SDK check ==="
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.2"

      - name: Clone official Telegram-iOS 11.12
        shell: bash
        run: |
          set -euxo pipefail
          git clone             --branch release-11.12             --depth 1             --recurse-submodules             --shallow-submodules             https://github.com/TelegramMessenger/Telegram-iOS.git Telegram-iOS
          cd Telegram-iOS
          git rev-parse HEAD
          cat versions.json

      - name: Build unsigned arm64 IPA
        shell: bash
        run: |
          set -euxo pipefail
          test -f build_unsigned.py
          cp build_unsigned.py Telegram-iOS/build_unsigned.py
          cd Telegram-iOS
          python3 build_unsigned.py

      - name: Inspect result
        shell: bash
        run: |
          set -euxo pipefail
          IPA="Telegram-iOS/out/Telegram-11.12-unsigned.ipa"
          test -f "$IPA"
          shasum -a 256 "$IPA"

          rm -rf /tmp/tgipa
          mkdir -p /tmp/tgipa
          unzip -q "$IPA" -d /tmp/tgipa

          APP="$(find /tmp/tgipa/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP"

          echo "=== App info ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

          BIN_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          file "$APP/$BIN_NAME"

          echo "=== Code signature ==="
          codesign -dv "$APP" 2>&1 || true

      - name: Upload Telegram IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-11.12-unsigned
          path: Telegram-iOS/out/Telegram-11.12-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
