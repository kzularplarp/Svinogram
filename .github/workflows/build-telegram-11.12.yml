name: Build Svinogram 11.12 injected v8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.2"

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f build_unsigned.py
          test -f Svinogram_1.2.1_iphoneos-arm.deb
          shasum -a 256 Svinogram_1.2.1_iphoneos-arm.deb

      - name: Clone official Telegram-iOS 11.12
        shell: bash
        run: |
          set -euxo pipefail
          git clone \
            --branch release-11.12 \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/TelegramMessenger/Telegram-iOS.git Telegram-iOS
          cd Telegram-iOS
          git rev-parse HEAD
          cat versions.json

      - name: Build unsigned Telegram 11.12
        shell: bash
        run: |
          set -euxo pipefail
          cp build_unsigned.py Telegram-iOS/build_unsigned.py
          cd Telegram-iOS
          python3 build_unsigned.py

      - name: Build insert_dylib
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git
          cc insert_dylib/insert_dylib/main.c -o insert_dylib_bin

      - name: Download SideloadFix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sideloadfix
          gh release download release \
            --repo waruhachi/SideloadFix \
            --pattern 'SideloadFix.dylib' \
            --dir sideloadfix
          test -f sideloadfix/SideloadFix.dylib
          shasum -a 256 sideloadfix/SideloadFix.dylib

      - name: Inject Svinogram correctly
        shell: bash
        run: |
          set -euxo pipefail

          IPA="$GITHUB_WORKSPACE/Telegram-iOS/out/Telegram-11.12-unsigned.ipa"
          DEB="$GITHUB_WORKSPACE/Svinogram_1.2.1_iphoneos-arm.deb"
          INSERT="$GITHUB_WORKSPACE/insert_dylib_bin"
          SIDELOAD_FIX="$GITHUB_WORKSPACE/sideloadfix/SideloadFix.dylib"

          rm -rf "$GITHUB_WORKSPACE/inject-work"
          mkdir -p "$GITHUB_WORKSPACE/inject-work/app" "$GITHUB_WORKSPACE/inject-work/deb"

          unzip -q "$IPA" -d "$GITHUB_WORKSPACE/inject-work/app"

          APP="$(find "$GITHUB_WORKSPACE/inject-work/app/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          PLIST="$APP/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          BIN="$APP/$EXECUTABLE_NAME"
          test -f "$BIN"

          cd "$GITHUB_WORKSPACE/inject-work/deb"
          ar x "$DEB"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR"

          TG_DYLIB="$(find . -type f -name 'TGExtra.dylib' | head -n 1)"
          TG_BUNDLE="$(find . -type d -name 'TGExtra.bundle' | head -n 1)"
          test -f "$TG_DYLIB"
          test -d "$TG_BUNDLE"

          mkdir -p "$APP/Frameworks"
          cp "$SIDELOAD_FIX" "$APP/Frameworks/SideloadFix.dylib"
          cp "$TG_DYLIB" "$APP/Frameworks/TGExtra.dylib"

          rm -rf "$APP/TGExtra.bundle"
          cp -R "$TG_BUNDLE" "$APP/TGExtra.bundle"

          # IMPORTANT:
          # SideloadFix must be loaded BEFORE TGExtra so its path/bundle hooks
          # exist before TGExtra constructors run.
          "$INSERT" --all-yes \
            "@executable_path/Frameworks/SideloadFix.dylib" \
            "$BIN"
          mv "${BIN}_patched" "$BIN"

          "$INSERT" --all-yes \
            "@executable_path/Frameworks/TGExtra.dylib" \
            "$BIN"
          mv "${BIN}_patched" "$BIN"

          # Give dylibs relocatable install names. This is not strictly
          # required for direct loading, but avoids absolute jailbreak-style
          # install names surviving into a jailed sideload build.
          install_name_tool -id "@rpath/SideloadFix.dylib" "$APP/Frameworks/SideloadFix.dylib" || true
          install_name_tool -id "@rpath/TGExtra.dylib" "$APP/Frameworks/TGExtra.dylib" || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleName Svinogram" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string Svinogram" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Svinogram" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Svinogram" "$PLIST"

          # The final Apple signature will be applied by SideStore.
          # Remove stale signatures from the three binaries we changed/added.
          codesign --remove-signature "$BIN" 2>/dev/null || true
          codesign --remove-signature "$APP/Frameworks/SideloadFix.dylib" 2>/dev/null || true
          codesign --remove-signature "$APP/Frameworks/TGExtra.dylib" 2>/dev/null || true
          rm -rf "$APP/_CodeSignature"
          find "$APP" -name embedded.mobileprovision -delete

          echo "=== MAIN EXECUTABLE LOAD ORDER ==="
          otool -L "$BIN" | grep -E 'SideloadFix|TGExtra'

          # Enforce the correct order, not merely presence.
          SIDE_LINE="$(otool -L "$BIN" | nl -ba | grep 'SideloadFix.dylib' | awk '{print $1}')"
          TG_LINE="$(otool -L "$BIN" | nl -ba | grep 'TGExtra.dylib' | awk '{print $1}')"
          test -n "$SIDE_LINE"
          test -n "$TG_LINE"
          test "$SIDE_LINE" -lt "$TG_LINE"

          echo "=== TGExtra direct dylib dependencies ==="
          otool -L "$APP/Frameworks/TGExtra.dylib"

          # libroot-related strings can exist in the binary without being a
          # dyld load dependency. Fail only if it is an actual LC_LOAD_DYLIB.
          if otool -L "$APP/Frameworks/TGExtra.dylib" | grep -q 'libroot.dylib'; then
            echo "ERROR: TGExtra has a real libroot dylib dependency."
            exit 1
          else
            echo "OK: libroot.dylib is NOT a direct dyld dependency."
          fi

          test -f "$APP/TGExtra.bundle/langs.json"
          test -f "$APP/Frameworks/TGExtra.dylib"
          test -f "$APP/Frameworks/SideloadFix.dylib"

          echo "=== Architectures ==="
          lipo -info "$BIN"
          lipo -info "$APP/Frameworks/TGExtra.dylib"
          lipo -info "$APP/Frameworks/SideloadFix.dylib"

          cd "$GITHUB_WORKSPACE/inject-work/app"
          rm -f "$GITHUB_WORKSPACE/Svinogram-11.12-v8-unsigned.ipa"
          zip -qry "$GITHUB_WORKSPACE/Svinogram-11.12-v8-unsigned.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/Svinogram-11.12-v8-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/Svinogram-11.12-v8-unsigned.ipa"

      - name: Upload fixed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Svinogram-11.12-v8-unsigned
          path: Svinogram-11.12-v8-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
