name: Build Svinogram 11.12 v9 CloudKit Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          sw_vers
          uname -m
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.2"

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f build_unsigned.py
          test -f Svinogram_1.2.1_iphoneos-arm.deb
          shasum -a 256 Svinogram_1.2.1_iphoneos-arm.deb

      - name: Clone official Telegram-iOS 11.12
        shell: bash
        run: |
          set -euxo pipefail
          git clone \
            --branch release-11.12 \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/TelegramMessenger/Telegram-iOS.git Telegram-iOS
          cd Telegram-iOS
          git rev-parse HEAD
          cat versions.json

      - name: Build sideload-safe Telegram 11.12
        shell: bash
        run: |
          set -euxo pipefail
          cp build_unsigned.py Telegram-iOS/build_unsigned.py
          cd Telegram-iOS
          python3 build_unsigned.py

      - name: Save clean no-iCloud base IPA
        shell: bash
        run: |
          set -euxo pipefail
          cp Telegram-iOS/out/Telegram-11.12-unsigned.ipa \
             Telegram-11.12-v9-noicloud-base.ipa

      - name: Build insert_dylib
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git
          cc insert_dylib/insert_dylib/main.c -o insert_dylib_bin

      - name: Install ldid
        shell: bash
        run: |
          set -euxo pipefail
          brew install ldid

      - name: Download upstream SideloadFix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sideloadfix
          gh release download release \
            --repo waruhachi/SideloadFix \
            --pattern 'SideloadFix.dylib' \
            --dir sideloadfix
          test -f sideloadfix/SideloadFix.dylib
          shasum -a 256 sideloadfix/SideloadFix.dylib

      - name: Inject Svinogram
        shell: bash
        run: |
          set -euxo pipefail

          IPA="$GITHUB_WORKSPACE/Telegram-iOS/out/Telegram-11.12-unsigned.ipa"
          DEB="$GITHUB_WORKSPACE/Svinogram_1.2.1_iphoneos-arm.deb"
          INSERT="$GITHUB_WORKSPACE/insert_dylib_bin"
          SIDELOAD_FIX="$GITHUB_WORKSPACE/sideloadfix/SideloadFix.dylib"

          rm -rf "$GITHUB_WORKSPACE/inject-work"
          mkdir -p "$GITHUB_WORKSPACE/inject-work/app" "$GITHUB_WORKSPACE/inject-work/deb"

          unzip -q "$IPA" -d "$GITHUB_WORKSPACE/inject-work/app"
          APP="$(find "$GITHUB_WORKSPACE/inject-work/app/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"

          PLIST="$APP/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          BIN="$APP/$EXECUTABLE_NAME"
          test -f "$BIN"

          cd "$GITHUB_WORKSPACE/inject-work/deb"
          ar x "$DEB"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR"

          TG_DYLIB="$(find . -type f -name 'TGExtra.dylib' | head -n 1)"
          TG_BUNDLE="$(find . -type d -name 'TGExtra.bundle' | head -n 1)"
          test -f "$TG_DYLIB"
          test -d "$TG_BUNDLE"

          mkdir -p "$APP/Frameworks"

          # Match TGExtra's own sideload workflow naming/layout.
          cp "$TG_DYLIB" "$APP/Frameworks/libTGExtra.dylib"
          cp "$SIDELOAD_FIX" "$APP/Frameworks/SideloadFix.dylib"

          rm -rf "$APP/TGExtra.bundle"
          cp -R "$TG_BUNDLE" "$APP/TGExtra.bundle"

          # Match upstream TGExtra injection order: tweak first, SideloadFix second.
          "$INSERT" --all-yes \
            "@executable_path/Frameworks/libTGExtra.dylib" \
            "$BIN"
          mv "${BIN}_patched" "$BIN"

          "$INSERT" --all-yes \
            "@executable_path/Frameworks/SideloadFix.dylib" \
            "$BIN"
          mv "${BIN}_patched" "$BIN"

          # Upstream TGExtra workflow ad-hoc signs the patched main Mach-O here.
          ldid -S "$BIN"

          /usr/libexec/PlistBuddy -c "Set :CFBundleName Svinogram" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string Svinogram" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Svinogram" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Svinogram" "$PLIST"

          echo "=== Injected load commands ==="
          otool -L "$BIN" | grep -E 'libTGExtra\.dylib|SideloadFix\.dylib'

          echo "=== Dylib architectures ==="
          lipo -info "$APP/Frameworks/libTGExtra.dylib"
          lipo -info "$APP/Frameworks/SideloadFix.dylib"

          # SideStore will replace signatures with the user's Apple certificate.
          rm -rf "$APP/_CodeSignature"
          find "$APP" -name embedded.mobileprovision -delete

          cd "$GITHUB_WORKSPACE/inject-work/app"
          zip -qry "$GITHUB_WORKSPACE/Svinogram-11.12-v9-noicloud-unsigned.ipa" Payload

          unzip -tq "$GITHUB_WORKSPACE/Svinogram-11.12-v9-noicloud-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/Svinogram-11.12-v9-noicloud-unsigned.ipa"

      - name: Upload fixed Svinogram IPA
        uses: actions/upload-artifact@v4
        with:
          name: Svinogram-11.12-v9-noicloud-unsigned
          path: Svinogram-11.12-v9-noicloud-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload clean diagnostic base IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-11.12-v9-noicloud-base
          path: Telegram-11.12-v9-noicloud-base.ipa
          if-no-files-found: error
          retention-days: 7
